<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="loginTitle">登录 · Yi-Num</title>
<meta name="description" content="登录 Yi-Num，易卦定数，数见天命。" />
<meta name="theme-color" content="#F3F1E5" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="login.css" />
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="halo" aria-hidden="true"></div>

<!-- ============ Header ============ -->
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="index.html" aria-label="Yi-Num 首页">
      <span class="brand-mark"><img src="assets/logo.png" alt="" width="227" height="227" /></span>
      <span class="brand-name">Yi-Num</span>
    </a>

    <!-- 语言切换 -->
    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu"
              data-i18n-aria="langAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18" />
          <path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z" />
        </svg>
        <span id="langCurrent">简体中文</span>
        <svg class="lang-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <ul class="lang-menu" id="langMenu" role="listbox" aria-labelledby="langBtn" hidden>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="zh-CN" aria-selected="true">
            <span>简体中文</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="en" aria-selected="false">
            <span>English</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="id" aria-selected="false">
            <span>Bahasa Indonesia</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </div>
</header>

<!-- ============ Auth ============ -->
<main class="auth">
  <div class="auth-shell">

    <!-- 欢迎语 -->
    <section class="welcome">
      <h1 class="auth-title" data-i18n="welcomeTitle">欢迎来到 Yi-Num</h1>
      <p class="auth-sub" data-i18n="welcomeSub">易卦定数，数见天命。</p>
    </section>

    <!-- 表单 -->
    <form class="form" id="loginForm" novalidate>
      <div class="field">
        <label class="sr-only" for="email" data-i18n="emailLabel">邮箱</label>
        <input class="input" id="email" name="email" type="email"
               inputmode="email" autocomplete="email" spellcheck="false"
               placeholder="输入你的邮箱地址" data-i18n-ph="emailPh" />
        <p class="error" id="emailError" hidden></p>
      </div>

      <div class="field">
        <label class="sr-only" for="code" data-i18n="codeLabel">验证码</label>
        <div class="field-row" id="codeRow">
          <input class="input input--bare" id="code" name="code" type="text"
                 inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                 placeholder="输入验证码" data-i18n-ph="codePh" />
          <button class="code-btn" id="sendCode" type="button" data-i18n="sendCode">发送验证码</button>
        </div>
        <p class="error" id="codeError" hidden></p>
        <p class="hint" id="sentHint" hidden></p>
      </div>

      <button class="cta auth-submit" type="submit" data-i18n="login">登录</button>
    </form>

    <!-- 第三方登录 -->
    <div class="divider"><span data-i18n="or">or</span></div>

    <button class="google-btn" id="googleBtn" type="button">
      <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span data-i18n="google">通过 Google 登录</span>
    </button>

    <!-- 协议 -->
    <p class="agreement">
      <span data-i18n="agreePrefix">使用即代表你同意我们的</span>
      <a href="#" data-i18n="terms">服务协议</a>
      <span>&amp;</span>
      <a href="#" data-i18n="privacy">隐私政策</a>
    </p>

  </div>
</main>

<script src="i18n.js"></script>
<!-- Firebase 兼容 SDK（仅当 firebase-config.js 中填入真实配置后启用真实登录） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
