<!DOCTYPE html>
<html><body>
<iframe id="f" src="offering.html" style="width:390px;height:780px;border:0"></iframe>
<pre id="out">PENDING</pre>
<script>
window.onload = function () {
  setTimeout(function () {
    try {
      var d = document.getElementById('f').contentDocument;
      var w = 390;
      var lines = [];
      lines.push('docSW=' + d.documentElement.scrollWidth + ' bodySW=' + d.body.scrollWidth);
      d.querySelectorAll('.of-main, .of-main > *, .of-tools, .of-bar').forEach(function (elm) {
        var r = elm.getBoundingClientRect();
        lines.push(elm.className + ' w=' + Math.round(r.width) + ' left=' + Math.round(r.left) + ' right=' + Math.round(r.right));
      });
      document.getElementById('out').textContent = lines.join('\n');
    } catch (e) { document.getElementById('out').textContent = 'ERR ' + e.message; }
  }, 1500);
};
</script>
</body></html>
