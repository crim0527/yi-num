        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>

        <svg class="luopan" viewBox="0 0 600 600" role="img" aria-label="融合八卦与紫微斗数星盘的罗盘图形">
          <defs>
            <radialGradient id="gAura" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".85" />
              <stop offset="62%"  stop-color="#FBF9F1" stop-opacity=".25" />
              <stop offset="100%" stop-color="#F3F1E5" stop-opacity="0" />
            </radialGradient>
            <line id="tk"  x1="300" y1="23" x2="300" y2="37" />
            <line id="tkL" x1="300" y1="23" x2="300" y2="48" />
            <line id="sect" x1="300" y1="38" x2="300" y2="102" />
            <line id="pal"  x1="300" y1="110" x2="300" y2="174" />
          </defs>

          <circle cx="300" cy="300" r="296" fill="url(#gAura)" />

          <!-- outer rings -->
          <circle class="ring r-16" cx="300" cy="300" r="286" />
          <circle class="ring r-10" cx="300" cy="300" r="277" />

          <!-- 24 solar ticks -->
          <g class="ticks spin-slow">
            <use href="#tkL" transform="rotate(0 300 300)" />
            <use href="#tk"  transform="rotate(15 300 300)" />
            <use href="#tk"  transform="rotate(30 300 300)" />
            <use href="#tkL" transform="rotate(45 300 300)" />
            <use href="#tk"  transform="rotate(60 300 300)" />
            <use href="#tk"  transform="rotate(75 300 300)" />
            <use href="#tkL" transform="rotate(90 300 300)" />
            <use href="#tk"  transform="rotate(105 300 300)" />
            <use href="#tk"  transform="rotate(120 300 300)" />
            <use href="#tkL" transform="rotate(135 300 300)" />
            <use href="#tk"  transform="rotate(150 300 300)" />
            <use href="#tk"  transform="rotate(165 300 300)" />
            <use href="#tkL" transform="rotate(180 300 300)" />
            <use href="#tk"  transform="rotate(195 300 300)" />
            <use href="#tk"  transform="rotate(210 300 300)" />
            <use href="#tkL" transform="rotate(225 300 300)" />
            <use href="#tk"  transform="rotate(240 300 300)" />
            <use href="#tk"  transform="rotate(255 300 300)" />
            <use href="#tkL" transform="rotate(270 300 300)" />
            <use href="#tk"  transform="rotate(285 300 300)" />
            <use href="#tk"  transform="rotate(300 300 300)" />
            <use href="#tkL" transform="rotate(315 300 300)" />
            <use href="#tk"  transform="rotate(330 300 300)" />
            <use href="#tk"  transform="rotate(345 300 300)" />
          </g>

          <circle class="ring r-14" cx="300" cy="300" r="262" />

          <!-- 八卦 sector dividers -->
          <g class="r-08">
            <use href="#sect" transform="rotate(22.5 300 300)" />
            <use href="#sect" transform="rotate(67.5 300 300)" />
            <use href="#sect" transform="rotate(112.5 300 300)" />
            <use href="#sect" transform="rotate(157.5 300 300)" />
            <use href="#sect" transform="rotate(202.5 300 300)" />
            <use href="#sect" transform="rotate(247.5 300 300)" />
            <use href="#sect" transform="rotate(292.5 300 300)" />
            <use href="#sect" transform="rotate(337.5 300 300)" />
          </g>

          <!-- 八卦 -->
          <g class="trigrams spin-slower">
            <!-- 乾 -->
            <g transform="rotate(0 300 300)"><g transform="translate(300 70)">
              <rect x="-34" y="8.5" width="68" height="5" rx="1.5" />
              <rect x="-34" y="-2.5" width="68" height="5" rx="1.5" />
              <rect x="-34" y="-13.5" width="68" height="5" rx="1.5" />
            </g></g>
            <!-- 兑 -->
            <g transform="rotate(45 300 300)"><g transform="translate(300 70)">
              <rect x="-34" y="8.5" width="68" height="5" rx="1.5" />
              <rect x="-34" y="-2.5" width="68" height="5" rx="1.5" />
              <rect x="-34" y="-13.5" width="28" height="5" rx="1.5" /><rect x="6" y="-13.5" width="28" height="5" rx="1.5" />
            </g></g>
            <!-- 离 -->
            <g transform="rotate(90 300 300)"><g transform="translate(300 70)">

              <rect x="-34" y="-2.5" width="28" height="5" rx="1.5" /><rect x="6" y="-2.5" width="28" height="5" rx="1.5" />
              <rect x="-34" y="-13.5" width="28" height="5" rx="1.5" /><rect x="6" y="-13.5" width="28" height="5" rx="1.5" />
            </g></g>
            <!-- 坤 -->
            <g transform="rotate(180 300 300)"><g transform="translate(300 70)">
              <rect x="-34" y="8.5" width="28" height="5" rx="1.5" /><rect x="6" y="8.5" width="28" height="5" rx="1.5" />
              <rect x="-34" y="-2.5" width="28" height="5" rx="1.5" /><rect x="6" y="-2.5" width="28" height="5" rx="1.5" />
              <rect x="-34" y="-13.5" width="28" height="5" rx="1.5" /><rect x="6" y="-13.5" width="28" height="5" rx="1.5" />
            </g></g>
            <!-- 艮 -->
            <g transform="rotate(225 300 300)"><g transform="translate(300 70)">
              <rect x="-34" y="8.5" width="28" height="5" rx="1.5" /><rect x="6" y="8.5" width="28" height="5" rx="1.5" />

            </g></g>
            <!-- 坎 -->
            <g transform="rotate(270 300 300)"><g transform="translate(300 70)">
              <rect x="-34" y="8.5" width="28" height="5" rx="1.5" /><rect x="6" y="8.5" width="28" height="5" rx="1.5" />

            <!-- 巽 -->

              <rect x="-34" y="-2.5" width="68" height="5" rx="1.5" />
              <rect x="-34" y="-13.5" width="68" height="5" rx="1.5" />
            </g></g>
          </g>

            <circle class="st st-ink"  cx="411.5" cy="199.6" r="2.1" />
            <circle class="st st-azure" cx="470.8" cy="257.4" r="3.1" />
            <circle class="st st-ink"  cx="437.8" cy="334.3" r="2.0" />
            <circle class="st st-gold" cx="409.3" cy="430.2" r="2.6" />
            <circle class="st st-ink"  cx="330.8" cy="444.8" r="2.2" />
            <circle class="st st-azure" cx="241.2" cy="461.6" r="2.9" />
            <circle class="st st-ink"  cx="191.5" cy="397.7" r="2.1" />
            <circle class="st st-gold" cx="127.3" cy="343.1" r="2.7" />
            <circle class="st st-ink"  cx="164.2" cy="266.1" r="2.0" />
            <circle class="st st-azure" cx="176.7" cy="188.9" r="3.0" />
            <circle class="st st-gold" cx="248.0" cy="157.2" r="2.3" />
          </g>

          <circle class="ring r-08" cx="300" cy="300" r="118" />

          <!-- 太极 -->
          <g transform="translate(300 300)">
            <circle r="62" fill="#FBF9F1" />
            <circle class="ring r-14" r="62" />
            <path class="yj" d="M0,-48 A48,48 0 0,1 0,48 A24,24 0 0,1 0,0 A24,24 0 0,0 0,-48 Z" />
            <circle class="yj-dot-light" cx="0" cy="24" r="7" />
            <circle class="yj-dot-dark"  cx="0" cy="-24" r="7" />
          </g>
        </svg>

        <figcaption class="chart-caption">
          <span>Zi Wei · Ba Gua</span>
          <span class="caption-rule" aria-hidden="true"></span>
          <span data-i18n="captionChart">紫微斗数命盘</span>

      </figure>
    </div>
