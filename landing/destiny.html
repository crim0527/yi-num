<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="destinyTitle">命格数字 · Yi-Num</title>
<meta name="description" content="请填写生辰八字，开启你的命格数字。" />
<meta name="theme-color" content="#F3F1E5" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="destiny.css" />
<script src="user.js"></script>
<script>
  /* 页面绘制前判断：已有推演结果且非「编辑重推」→ 直接结果页，避免先渲染表单再跳转的闪烁 */
  (function () {
    var editing = /[?&]edit=1\b/.test(location.search);
    if (editing) return;
    var hasResult = false;
    try {
      var _acct = (window.YiNumUser && window.YiNumUser.getAccountId) ? window.YiNumUser.getAccountId() : 'anon';
      hasResult = !!localStorage.getItem('yinum.destiny.result:' + _acct);
    } catch (e) { hasResult = false; }
    if (hasResult) location.replace('detail.html');
  })();
</script>
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="halo" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- ============ Header ============ -->
  <header class="app-header">
    <button class="menu-btn" id="burger" type="button"
            aria-label="打开菜单" aria-expanded="false" aria-controls="drawer"
            data-i18n-aria="menuAria">
      <span></span><span></span><span></span>
    </button>

    <h1 class="app-title" data-i18n="pageTitle">命格数字</h1>

    <!-- 语言切换（与首页一致） -->
    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu"
              data-i18n-aria="langAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18" />
          <path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z" />
        </svg>
        <span id="langCurrent">简体中文</span>
        <svg class="lang-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <ul class="lang-menu" id="langMenu" role="listbox" aria-labelledby="langBtn" hidden>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="zh-CN" aria-selected="true">
            <span>简体中文</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="en" aria-selected="false">
            <span>English</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="id" aria-selected="false">
            <span>Bahasa Indonesia</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </header>

  <!-- ============ 主体：基础信息输入 ============ -->
  <main class="app-main">
    <section class="form-wrap">
      <form class="form-card" id="destinyForm" novalidate>
        <h2 class="form-title" data-i18n="formTitle">请填写你的基础信息</h2>
        <p class="form-sub" data-i18n="formSub">生辰八字是命理推演的基础，请尽可能准确填写。</p>

        <div class="field">
          <label class="field-label" data-i18n="labelBirth">出生年月日</label>
          <div class="select-wrap">
            <!-- 原生 select 仅作值容器（隐藏）；展示与交互统一走底部弹层滚轮 -->
            <select class="select" id="birthYear" aria-label="年" hidden></select>
            <select class="select" id="birthMonth" aria-label="月" hidden></select>
            <select class="select" id="birthDay" aria-label="日" hidden></select>
            <button type="button" class="select picker-trigger" id="dateTrigger"
                    aria-haspopup="dialog" aria-label="出生年月日">
              <span id="dateTriggerText">出生年月日</span>
            </button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="labelTime">出生时间</label>
          <div class="select-wrap">
            <select class="select" id="birthHour" aria-label="时辰" hidden></select>
            <button type="button" class="select picker-trigger" id="hourTrigger"
                    aria-haspopup="dialog" aria-label="时辰">
              <span id="hourTriggerText">时辰</span>
            </button>
          </div>
          <label class="switch">
            <input type="checkbox" id="unknownTime" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span class="switch-text" data-i18n="unknownTime">不清楚具体时间</span>
          </label>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="labelGender">性别</label>
          <div class="select-wrap">
            <select class="select" id="birthGender" aria-label="性别" hidden></select>
            <button type="button" class="select picker-trigger" id="genderTrigger"
                    aria-haspopup="dialog" aria-label="性别">
              <span id="genderTriggerText">请选择</span>
            </button>
          </div>
        </div>

        <p class="form-error" id="formError" role="alert" hidden></p>
        <button class="btn-submit" type="submit" data-i18n="seal">开启命格数字</button>
      </form>
    </section>
  </main>

  <!-- 通用底部弹层滚轮（出生年月日 / 出生时间 / 性别 共用） -->
  <div class="picker-mask" id="pickerMask" hidden></div>
  <div class="picker-sheet" id="pickerSheet" role="dialog" aria-modal="true" aria-label="请选择" hidden>
    <div class="picker-head">
      <button type="button" class="picker-cancel" id="pickerCancel" data-i18n="pickerCancel">取消</button>
      <span class="picker-title" id="pickerTitle">请选择</span>
      <button type="button" class="picker-confirm" id="pickerConfirm" data-i18n="pickerDone">完成</button>
    </div>
    <div class="picker-units" id="pickerUnits" hidden></div>
    <div class="picker-viewport">
      <div class="picker-cols" id="pickerCols"></div>
      <div class="picker-indicator" aria-hidden="true"></div>
    </div>
  </div>

  <!-- 推演加载层 -->
  <div class="derive" id="derive" hidden aria-live="polite">
    <img class="taiji" src="assets/logo.png" alt="" aria-hidden="true" />
    <p class="derive-text" data-i18n="deriving">推演中…</p>
  </div>

  <!-- ============ 抽屉菜单 ============ -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="菜单">
    <div class="drawer-top">
      <a class="drawer-brand" href="index.html">
        <img class="drawer-brand-logo" src="assets/logo.png" alt="" width="30" height="30" />
        <span class="drawer-brand-name">Yi-Num</span>
      </a>
      <button class="drawer-close" id="drawerClose" type="button"
              aria-label="关闭菜单" data-i18n-aria="closeAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <nav class="drawer-nav" aria-label="主导航">
      <a class="drawer-item" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11l8-6 8 6" />
          <path d="M6 10v9h12v-9" />
          <path d="M10 19v-5h4v5" />
        </svg>
        <span data-i18n="navHome">首页</span>
      </a>
      <a class="drawer-item is-active" href="destiny.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M15.2 8.8l-2.1 4.6-4.3 2 2.1-4.6z" />
        </svg>
        <span data-i18n="navDestiny">命格数字</span>
      </a>
      <a class="drawer-item" href="lucky-open.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3.5 2" />
        </svg>
        <span data-i18n="navLuckyTime">今日吉时</span>
      </a>
      <a class="drawer-item" href="ask.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16v11H8l-4 4z" />
        </svg>
        <span data-i18n="navAsk">定制问事</span>
      </a>
      <a class="drawer-item" href="ziwei.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 3v18" />
          <path d="M3 12h18" />
          <path d="M5.6 5.6l12.8 12.8" />
        </svg>
        <span data-i18n="navZiwei">紫微斗数</span>
      </a>
      <a class="drawer-item" href="offering.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4c1.5 1.7 2.4 3.4 2.4 5A2.4 2.4 0 0 1 12 11.4 2.4 2.4 0 0 1 9.6 9c0-1.6.9-3.3 2.4-5z" />
          <path d="M5.5 13.5h13" />
          <path d="M7.5 13.5v2.8A3.2 3.2 0 0 0 10.7 19.5h2.6a3.2 3.2 0 0 0 3.2-3.2v-2.8" />
        </svg>
        <span data-i18n="navOffering">供奉</span>
      </a>
      <a class="drawer-item" href="about.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5" />
          <path d="M12 7.5h.01" />
        </svg>
        <span data-i18n="navAbout">关于</span>
      </a>
    </nav>

    <div class="drawer-foot">
      <button class="drawer-add" id="addToHome" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v10m0 0l-4-4m4 4l4-4" />
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
        </svg>
        <span data-i18n="drawerAdd">添加到桌面</span>
      </button>
      <a class="drawer-user" href="login.html">
        <span class="drawer-avatar" aria-hidden="true">易</span>
        <span class="drawer-user-meta">
          <span class="drawer-user-name" data-i18n="guest">未登录</span>
          <span class="drawer-user-sub" data-i18n="guestHint">点击登录</span>
        </span>
        <svg class="drawer-user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 15l6-6 6 6" />
        </svg>
      </a>
    </div>
  </aside>

</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="destiny-api.js"></script>
<script src="destiny.js"></script>
</body>
</html>
