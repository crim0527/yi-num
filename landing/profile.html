<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="profileMetaTitle">个人中心 · Yi-Num</title>
<meta name="description" content="Yi-Num 个人中心：管理你的生辰资料、积分与每日打卡。" />
<meta name="theme-color" content="#F3F1E5" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="app.css" />
<!-- 复用【命数】页的表单 / 滚轮套件，保证视觉与交互统一 -->
<link rel="stylesheet" href="destiny.css" />
<link rel="stylesheet" href="profile.css" />
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="halo" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- ============ Header（与命数页一致） ============ -->
  <header class="app-header">
    <button class="menu-btn" id="burger" type="button"
            aria-label="打开菜单" aria-expanded="false" aria-controls="drawer"
            data-i18n-aria="menuAria">
      <span></span><span></span><span></span>
    </button>

    <h1 class="app-title" data-i18n="profilePageTitle">个人中心</h1>

    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu"
              data-i18n-aria="langAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18" />
          <path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z" />
        </svg>
        <span id="langCurrent">简体中文</span>
        <svg class="lang-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <ul class="lang-menu" id="langMenu" role="listbox" aria-labelledby="langBtn" hidden>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="zh-CN" aria-selected="true">
            <span>简体中文</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="en" aria-selected="false">
            <span>English</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="option" data-lang="id" aria-selected="false">
            <span>Bahasa Indonesia</span>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </header>

  <!-- ============ 主体 ============ -->
  <main class="app-main">
    <div class="profile">

      <!-- ① 个人资料卡 -->
      <section class="p-card p-card--profile reveal">
        <button class="p-edit" id="editTrigger" type="button" data-i18n-aria="profileEditAria">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16z" />
            <path d="M13.5 6.5l4 4" />
          </svg>
          <span data-i18n="profileEdit">编辑</span>
        </button>

        <div class="p-id">
          <button class="p-avatar" id="avatarBtn" type="button" data-i18n-aria="profileAvatarAria">
            <span class="p-avatar-text" id="avatarText">易</span>
            <span class="p-avatar-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8h3l1.5-2h7L17 8h3v11H4z" />
                <circle cx="12" cy="13" r="3.2" />
              </svg>
            </span>
          </button>

          <div class="p-id-meta">
            <p class="p-nick" id="nickText">昵称</p>
            <p class="p-mail" id="mailText">user@example.com</p>
          </div>
        </div>

        <div class="p-facts">
          <button class="p-fact" type="button" data-edit-field="birth">
            <span class="p-fact-k" data-i18n="labelBirth">出生年月日</span>
            <span class="p-fact-v" id="factBirth">未填写，点击完善</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>

          <button class="p-fact" type="button" data-edit-field="time">
            <span class="p-fact-k" data-i18n="labelTime">出生时间</span>
            <span class="p-fact-v" id="factTime">未填写，点击完善</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>

          <button class="p-fact" type="button" data-edit-field="gender">
            <span class="p-fact-k" data-i18n="labelGender">性别</span>
            <span class="p-fact-v" id="factGender">未填写，点击完善</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </section>

      <!-- ② 积分卡 -->
      <section class="p-card p-card--points reveal">
        <div class="p-points-head">
          <div class="p-points-meta">
            <p class="p-points-k" data-i18n="profilePoints">我的积分</p>
            <p class="p-points-v">
              <span id="pointsNum">0</span><span class="p-points-unit" data-i18n="profilePointsUnit">分</span>
            </p>
          </div>

          <button class="p-ghost" id="historyBtn" type="button" data-i18n-aria="profileHistoryAria">
            <span data-i18n="profileHistory">积分记录</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>

        <div class="p-week" id="weekStrip" role="group" aria-label="打卡"></div>

        <button class="p-checkin" id="checkinBtn" type="button" data-i18n="profileCheckin">今日打卡</button>
      </section>

      <!-- ③ 退出登录 -->
      <button class="p-signout" id="signoutBtn" type="button" data-i18n="profileSignOut">退出登录</button>

    </div>
  </main>

  <!-- ============ 弹层遮罩 ============ -->
  <div class="picker-mask" id="sheetMask" hidden></div>

  <!-- ============ 编辑资料弹层 ============ -->
  <div class="picker-sheet p-sheet" id="editSheet" role="dialog" aria-modal="true"
       aria-labelledby="editTitle" hidden>
    <div class="picker-head">
      <button type="button" class="picker-cancel" id="editCancel" data-i18n="pickerCancel">取消</button>
      <span class="picker-title" id="editTitle" data-i18n="profileEditTitle">编辑资料</span>
      <span class="picker-head-space" aria-hidden="true"></span>
    </div>

    <div class="p-sheet-body">
      <p class="p-sheet-note" data-i18n="profileEditSub">保存后同步至【命格数字】，命理结果需重新推演。</p>

      <div class="p-field">
        <span class="p-field-label" data-i18n="labelBirth">出生年月日</span>
        <div class="select-wrap">
          <select class="select" id="editYear" aria-label="年" hidden></select>
          <select class="select" id="editMonth" aria-label="月" hidden></select>
          <select class="select" id="editDay" aria-label="日" hidden></select>
          <button type="button" class="select picker-trigger" id="dateTrigger"
                  aria-haspopup="dialog">
            <span id="dateTriggerText">出生年月日</span>
          </button>
        </div>
      </div>

      <div class="p-field">
        <span class="p-field-label" data-i18n="labelTime">出生时间</span>
        <div class="select-wrap">
          <select class="select" id="editHour" aria-label="时辰" hidden></select>
          <button type="button" class="select picker-trigger" id="hourTrigger"
                  aria-haspopup="dialog">
            <span id="hourTriggerText">时辰</span>
          </button>
        </div>
        <label class="switch">
          <input type="checkbox" id="unknownTime" />
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span class="switch-text" data-i18n="unknownTime">不清楚具体时间</span>
        </label>
      </div>

      <div class="p-field">
        <span class="p-field-label" data-i18n="labelGender">性别</span>
        <div class="select-wrap">
          <select class="select" id="editGender" aria-label="性别" hidden></select>
          <button type="button" class="select picker-trigger" id="genderTrigger"
                  aria-haspopup="dialog">
            <span id="genderTriggerText">请选择</span>
          </button>
        </div>
      </div>

      <p class="form-error" id="editError" role="alert" hidden></p>
      <button class="btn-submit" id="editSave" type="button" data-i18n="profileSave">保存</button>
    </div>
  </div>

  <!-- ============ 积分记录弹层 ============ -->
  <div class="picker-sheet p-sheet" id="historySheet" role="dialog" aria-modal="true"
       aria-labelledby="historyTitle" hidden>
    <div class="picker-head">
      <button type="button" class="picker-cancel" id="historyCancel" data-i18n="pickerCancel">取消</button>
      <span class="picker-title" id="historyTitle" data-i18n="profileHistory">积分记录</span>
      <span class="picker-head-space" aria-hidden="true"></span>
    </div>
    <div class="p-sheet-body">
      <ul class="p-history" id="historyList"></ul>
      <p class="p-empty-box" id="historyEmpty" hidden data-i18n="profileHistoryEmpty">暂无记录</p>
    </div>
  </div>

  <!-- ============ 滚轮选择器（与命数页同款，置于弹层之上） ============ -->
  <div class="picker-mask" id="pickerMask" hidden></div>
  <div class="picker-sheet" id="pickerSheet" role="dialog" aria-modal="true" aria-label="请选择" hidden>
    <div class="picker-head">
      <button type="button" class="picker-cancel" id="pickerCancel" data-i18n="pickerCancel">取消</button>
      <span class="picker-title" id="pickerTitle">请选择</span>
      <button type="button" class="picker-confirm" id="pickerConfirm" data-i18n="pickerDone">完成</button>
    </div>
    <div class="picker-units" id="pickerUnits" hidden></div>
    <div class="picker-viewport">
      <div class="picker-cols" id="pickerCols"></div>
      <div class="picker-indicator" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ============ 抽屉菜单 ============ -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="菜单">
    <div class="drawer-top">
      <a class="drawer-brand" href="index.html">
        <img class="drawer-brand-logo" src="assets/logo.png" alt="" width="30" height="30" />
        <span class="drawer-brand-name">Yi-Num</span>
      </a>
      <button class="drawer-close" id="drawerClose" type="button"
              aria-label="关闭菜单" data-i18n-aria="closeAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <nav class="drawer-nav" aria-label="主导航">
      <a class="drawer-item" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11l8-6 8 6" />
          <path d="M6 10v9h12v-9" />
          <path d="M10 19v-5h4v5" />
        </svg>
        <span data-i18n="navHome">首页</span>
      </a>
      <a class="drawer-item" href="destiny.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M15.2 8.8l-2.1 4.6-4.3 2 2.1-4.6z" />
        </svg>
        <span data-i18n="navDestiny">命格数字</span>
      </a>
      <a class="drawer-item" href="lucky-open.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3.5 2" />
        </svg>
        <span data-i18n="navLuckyTime">今日吉时</span>
      </a>
      <a class="drawer-item" href="ask.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16v11H8l-4 4z" />
        </svg>
        <span data-i18n="navAsk">定制问事</span>
      </a>
      <a class="drawer-item" href="ziwei.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 3v18" />
          <path d="M3 12h18" />
          <path d="M5.6 5.6l12.8 12.8" />
        </svg>
        <span data-i18n="navZiwei">紫微斗数</span>
      </a>
      <a class="drawer-item" href="offering.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4c1.5 1.7 2.4 3.4 2.4 5A2.4 2.4 0 0 1 12 11.4 2.4 2.4 0 0 1 9.6 9c0-1.6.9-3.3 2.4-5z" />
          <path d="M5.5 13.5h13" />
          <path d="M7.5 13.5v2.8A3.2 3.2 0 0 0 10.7 19.5h2.6a3.2 3.2 0 0 0 3.2-3.2v-2.8" />
        </svg>
        <span data-i18n="navOffering">每日供奉</span>
      </a>
      <a class="drawer-item" href="about.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5" />
          <path d="M12 7.5h.01" />
        </svg>
        <span data-i18n="navAbout">关于</span>
      </a>
    </nav>

    <div class="drawer-foot">
      <a class="drawer-user" href="profile.html">
        <span class="drawer-avatar" aria-hidden="true">易</span>
        <span class="drawer-user-meta">
          <span class="drawer-user-name">未登录</span>
          <span class="drawer-user-sub">点击登录</span>
        </span>
        <svg class="drawer-user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 15l6-6 6 6" />
        </svg>
      </a>
    </div>
  </aside>

</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="user.js"></script>
<script src="auth.js"></script>
<script src="profile.js"></script>
<script src="drawer-user.js"></script>
</body>
</html>
